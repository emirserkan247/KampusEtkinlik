<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Etkinlik Güncelle</title>
</head>
<body>
  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="index.html">Liste</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <br>

  <main>
    <form method="POST">
      
      <label for="ad">Etkinlik Adı</label><br>
      <input type="text" id="ad" name="ad" value="Kariyer Günleri" required><br><br>

      <label for="kategori">Kategori</label><br>
      <select id="kategori" name="kategori" required>
        <option selected>Seminer</option>
        <option>Atölye</option>
      </select><br><br>

      
      <label for="tarih">Tarih</label><br>
      <input type="date" id="tarih" name="tarih" value="2026-10-12" required><br><br>

      <label for="aciklama">Açıklama</label><br>
      
      <textarea id="aciklama" name="aciklama" rows="3" required>Mezun söyleşileri</textarea><br><br>

      <button type="submit">Güncelle</button>
    </form>
  </main>
</body>
</html>
